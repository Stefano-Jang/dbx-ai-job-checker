[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-ai-job-checker"
version = "0.1.0"
description = "Customer-installed Databricks AI Job Checker"
requires-python = ">=3.10"

[project.scripts]
ai-job-checker = "ai_job_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

