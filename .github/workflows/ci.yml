name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Reject local state and obvious credentials
        run: |
          test ! -e .local
          ! git grep -E 'dapi[a-f0-9]{20,}|DATABRICKS_TOKEN[[:space:]]*=' -- ':!requirement.md' ':!plan.md'

