name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r src/app/requirements.txt
          python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Reject local state and obvious credentials
        run: |
          test ! -e .local/config.json
          test ! -e .local/setup-state.json
          test -e .local/config.example.json
          test -e .local/setup-state.example.json
          ! git grep -E 'dapi[a-f0-9]{20,}|DATABRICKS_TOKEN[[:space:]]*=' -- ':!requirement.md' ':!plan.md'
