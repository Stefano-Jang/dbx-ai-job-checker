resources:
  apps:
    job_checker_app:
      name: ai-job-checker
      description: Lakeflow run quality and semantic analysis
      source_code_path: ../src/app
      config:
        command:
          - python
          - app.py
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_JOB_DEMO
            value_from: demo-job
          - name: DATABRICKS_SERVING_ENDPOINT_NAME
            value_from: serving-endpoint
          - name: APP_CATALOG
            value: ai_job_checker
          - name: APP_SCHEMA
            value: ops
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: demo-job
          job:
            id: ${resources.jobs.demo_ltv.id}
            permission: CAN_MANAGE_RUN
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: run-reports-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.run_reports
            permission: SELECT
        - name: quality-metrics-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.quality_metrics
            permission: SELECT
